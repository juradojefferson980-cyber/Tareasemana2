<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ejercicio 5: Validación de Formulario</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; font-family: "Segoe UI", Arial, sans-serif; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #1f2937; }
  form { width: min(380px, 92vw); padding: 28px; border-radius: 18px; background: #fff; box-shadow: 0 20px 40px rgba(0,0,0,.25); }
  h1 { margin: 0 0 18px; font-size: 1.5rem; text-align: center; }
  label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: .9rem; }
  input { width: 100%; padding: 10px 12px; font-size: 1rem; border: 2px solid #d1d5db; border-radius: 8px; outline: none; transition: border-color .2s; }
  input:focus { border-color: #6366f1; }
  input.error { border-color: #ef4444; background: #fef2f2; }
  input.ok { border-color: #22c55e; }
  .msg { min-height: 1.1em; margin-top: 3px; font-size: .8rem; color: #dc2626; }
  button { width: 100%; margin-top: 18px; padding: 12px; font-size: 1rem; font-weight: 600; border: 0; border-radius: 8px; background: #6366f1; color: #fff; cursor: pointer; }
  button:hover { background: #4f46e5; }
  #resultado { margin-top: 14px; padding: 10px; border-radius: 8px; text-align: center; display: none; background: #dcfce7; color: #166534; font-weight: 600; }
  a { color: #fff; text-decoration: none; }
</style>
</head>
<body>
  <form id="formulario" novalidate>
    <h1>Registro</h1>

    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" placeholder="Tu nombre">
    <div class="msg" id="eNombre"></div>

    <label for="correo">Correo electrónico</label>
    <input type="email" id="correo" placeholder="tucorreo@ejemplo.com">
    <div class="msg" id="eCorreo"></div>

    <label for="clave">Contraseña</label>
    <input type="password" id="clave" placeholder="Mínimo 6 caracteres">
    <div class="msg" id="eClave"></div>

    <button type="submit">Enviar</button>
    <div id="resultado"></div>
  </form>
  <a href="index.html">← Volver al menú</a>

<script>
  const form = document.getElementById("formulario");
  const campos = [
    { input: "nombre", error: "eNombre", vacio: "El nombre es obligatorio." },
    { input: "correo", error: "eCorreo", vacio: "El correo es obligatorio.",
      extra: v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) ? "" : "Ingresa un correo válido." },
    { input: "clave",  error: "eClave",  vacio: "La contraseña es obligatoria.",
      extra: v => v.length >= 6 ? "" : "Debe tener al menos 6 caracteres." }
  ];

  function validar(c) {
    const el = document.getElementById(c.input);
    const v = el.value.trim();
    let msg = v === "" ? c.vacio : (c.extra ? c.extra(v) : "");
    document.getElementById(c.error).textContent = msg;
    el.classList.toggle("error", msg !== "");
    el.classList.toggle("ok", msg === "");
    return msg === "";
  }

  campos.forEach(c => document.getElementById(c.input).addEventListener("input", () => validar(c)));

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    const resultado = document.getElementById("resultado");
    const todoOk = campos.map(validar).every(Boolean);   // valida todos los campos
    resultado.style.display = "block";
    if (todoOk) {
      resultado.style.background = "#dcfce7"; resultado.style.color = "#166534";
      resultado.textContent = "✔ Formulario enviado correctamente";
    } else {
      resultado.style.background = "#fee2e2"; resultado.style.color = "#991b1b";
      resultado.textContent = "✘ Corrige los campos marcados";
    }
  });
</script>
</body>
</html>
